name: terraform-landing-zone

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Terraform stack path
        required: true
        default: environments/dev

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: 1.6.6

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - global/bootstrap
          - global/organization
          - global/security
          - global/network
          - environments/dev
          - environments/test
          - environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init without backend
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.stack }}
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.stack }}
          framework: terraform

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: plan
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Plan
        working-directory: ${{ github.event.inputs.stack }}
        run: |
          terraform init
          terraform plan -out=tfplan

  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Apply
        working-directory: ${{ github.event.inputs.stack }}
        run: |
          terraform init
          terraform apply -auto-approve
